# plan.yaml for a silicon point-defect workflow example.
#
# This file is COMPLETE and validates against the JSON Schema in
# scripts/pydefect_auto/schema.py. Run:
#   pydefect-run plan --validate --obj Si --poscar ./unitcell/structure_opt/POSCAR
# to re-validate, then:
#   pydefect-run run --auto
# to execute the 7 stages.
#
# Each stage will write its outputs into the corresponding subdirectory
# listed below. The directories already exist (with .gitkeep) so the
# first stage of stage1 can find them.

project:
  obj: Si
  dopant_elements: []
  poscar_src: "local: ./unitcell/structure_opt/POSCAR"

parameters:
  functional: pbesol
  # ENCUT auto-detected from Si POTCAR ENMAX (~245 eV) -> 1.3x ~= 320.
  # Override here if your POTCAR set gives a different ENMAX.
  encut: 318
  hubbard_u: false
  # Default POTCAR variants for Si; override to e.g. ["Si_sv"] for semicore.
  pp: [Si]

supercell:
  # 64-atom conventional cell (2x2x2 of 8-atom conv) = 320 Ry / atom * 64 = OK
  max_atoms: 600
  min_atoms: 64

defects:
  # Intrinsic vacancies on the Si sublattice (just one element here).
  vacancies: [Si]
  substitutionals: []
  interstitials: false
  # Indices into volumetric_data_local_extrema.json; empty until stage1
  # DOS has been run and pydefect_vasp local_extrema executed.
  iindex: []
  # Default charge states. Si vacancies are typically q=0, +/-1, +/-2.
  charges: [0, -1, -2, 1, 2]
  # 1 = no complex defects. Set to 2+ to enable stage7 (needs pydefect-complex).
  complex_n: 1
  max_distance: 3.0
  min_distance: 0.3

cpd:
  # Per-formula gas correction in eV (added to composition_energies.yaml).
  # O2/Cl2/F2 are the typical cases; Si has no gas phase so this is empty.
  gas_corrections: {}

crisp:
  # SLURM cluster name; null uses the user's default in ~/crisp.
  cluster: null

stages:
  unitcell: true   # 1. Structure opt + band + DOS + dielectric
  cpd: true        # 2. Competing phases -> CPD
  defect_gen: true # 3. Supercell + defect_set + vise inputs
  submit: true     # 4. crisp batch submit
  postproc: true   # 5. eFNV + formation energies
  doping: false    # 6. Set true to add dopants incrementally
  complex: false   # 7. Set true after installing pydefect-complex
